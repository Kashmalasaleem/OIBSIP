<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>TO DO LIST WEB APP</title>
    <script defer src="script.js"></script>
  </head>
  <body>
    <div class="container">
      <h1>TO-DO LIST</h1>

      <input type="text" id="taskInput" placeholder="ADD YOUR TASK" />
      <button class="addtask" value="addtask" id="addTask">Add</button>

      <h2>Pending Tasks</h2>

      <p id="pendingCount">0 pending</p>

      <div id="pendingTasks">
        <!-- Pending tasks will appear here -->
      </div>

      <h2>Completed Tasks</h2>

      <p id="completedCount">0 completed</p>

      <div id="completedTasks">
        <!-- Completed tasks will appear here -->
      </div>
    </div>
  </body>
</html>
